[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short
markers =
    llm: live model call; skipped without OPENROUTER_API_KEY
    eval: agent eval case; offline replay unless also marked llm
    judge: eval scored by an LLM judge (KCH-250); needs a live key
