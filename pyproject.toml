[project]
name = "finhive"
version = "0.1.0"
description = "FinHive Loan Manager — MVP2 API and domain"
requires-python = ">=3.10"

# Kept deliberately small. Every addition is a dependency the Vercel Python bundle
# has to cold-start with, and at 3 DAU most requests are cold (ARD v2.0.0 §7).
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.5",
    "asyncpg>=0.29",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finhive*"]

# ── tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a database (ephemeral Supabase branch or local Postgres)",
    "e2e: drives the deployed app; not run in the unit suite",
]

[tool.coverage.run]
source = ["finhive"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# 85% is the ARD target. Raised, never lowered.
fail_under = 85
show_missing = true

# ── lint ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # assert is how tests assert

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

# ── types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true

# The domain and calculation layers are pure and carry the business rules, so they
# get strict typing. The rest is checked, not policed.
[[tool.mypy.overrides]]
module = ["finhive.domain.*", "finhive.calc.*"]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true

# ── architecture boundaries ─────────────────────────────────────────────────
# ARD v2.0.0 §5 "How the boundary is *enforced* (not just documented)": these
# contracts are the enforcement, not the diagram. `lint-imports` runs in CI
# (see .github/workflows/ci.yml) and fails the build on a violating import.
[tool.importlinter]
root_package = "finhive"

[[tool.importlinter.contracts]]
name = "calc-service is pure"
type = "forbidden"
source_modules = ["finhive.calc"]
forbidden_modules = ["finhive.db", "finhive.agent", "httpx", "asyncpg"]

[[tool.importlinter.contracts]]
name = "agent never touches SQL directly"
type = "forbidden"
source_modules = ["finhive.agent"]
forbidden_modules = ["asyncpg", "finhive.db.raw"]

[[tool.importlinter.contracts]]
name = "domain does not depend on infrastructure or presentation"
type = "forbidden"
source_modules = ["finhive.domain"]
forbidden_modules = ["finhive.db", "api"]
