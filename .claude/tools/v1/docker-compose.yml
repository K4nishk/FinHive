version: '3.8'

services:
  loantracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loantracker
    ports:
      - "8000:8000"
    volumes:
      - ./engine_output:/app/engine_output
      - ./logs:/app/logs
      - ./.env:/.env:ro
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-csv}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - CSV_OUTPUT_DIR=/app/engine_output
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
