name: CI

# Fast gate tier (ARD v2.0.0 §17). Cheapest checks run first, as one sequential job:
# a failed step stops the job immediately instead of burning time on later ones, so a
# lint error is blocked in well under the 30s acceptance target instead of waiting on
# the rest of the tier.
on:
  pull_request:
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: Fast gates
    runs-on: ubuntu-latest
    # Hard budget from the issue: the whole tier must finish under two minutes.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python lint/type-check deps
        # [server] keeps fastapi/asyncpg available for the finhive side. They moved
        # out of the core dependency set in KCH-226 so the desktop app can install
        # `finhive` for crypto alone, without a source-built asyncpg on Python 3.14.
        run: pip install -e ".[dev,server]"

      - name: ruff
        run: ruff check finhive tests

      - name: mypy --strict (domain, calc)
        run: mypy --strict finhive/domain finhive/calc

      - name: import-linter (architecture boundaries)
        run: lint-imports

      # The WHOLE unit suite, not one file. Until KCH-230 this step ran only
      # test_blind_index_lint.py, so the other 20 modules in tests/unit -- and
      # every module in tests/integration -- were never executed by any CI job.
      # Three broken migrations shipped through that hole (KCH-225).
      # No database needed here; the Postgres lane is its own job below, so
      # this tier stays inside its two-minute budget.
      - name: unit suite (incl. blind-index lint, ADR-2.4)
        run: pytest tests/unit -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web lint/format deps
        working-directory: web
        run: npm ci

      - name: prettier
        working-directory: web
        run: npx prettier --check src

      - name: eslint
        working-directory: web
        run: npm run lint

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    # Proves migrations 0001-0005 actually APPLY, rather than asserting their
    # SQL text. The text assertions in tests/unit passed for months against
    # migrations that could not run at all.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finhive
          POSTGRES_PASSWORD: finhive
          POSTGRES_DB: finhive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -e ".[dev,server]"

      - name: Run the Postgres integration lane
        env:
          TEST_DATABASE_URL: postgresql://finhive:finhive@localhost:5432/finhive_test
          # Turns "everything skipped" from a silent green into a hard error.
          # Without this a typo in the URL above looks identical to a pass.
          FINHIVE_REQUIRE_INTEGRATION: "1"
        run: pytest tests/integration -q

  mvp1-regression:
    name: MVP1 regression
    runs-on: ubuntu-latest
    # Business-continuity gate (KCH-88): the MVP1 desktop app under active real-world
    # use must never regress while MVP2 is built alongside it, so this job runs the
    # full MVP1 suite against src/Loan Manager on every PR -- regardless of which
    # paths changed. It is DOCUMENTED as a required check (docs/AGENT_CONTRACT.md,
    # KCH-86) but that ruleset has never been applied: as of 2026-09-24 neither
    # development nor main requires any status check, so a red run here does NOT
    # block merge. Applying the ruleset is a repo-admin action.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Loan Manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/Loan Manager/requirements.txt

      - name: Install MVP1 dependencies
        run: pip install -r requirements.txt

      - name: Run MVP1 unit, integration and smoke tests
        run: python -m pytest tests/ -v --cov=loan_manager
